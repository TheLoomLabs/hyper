<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="hyper — nothing reaches the world unreviewed; nothing changes unseen">
  <!-- Source for social-preview.png, which is what GitHub's Settings → Social preview
       accepts (it takes no SVG). 1280x640 is the 2:1 ratio that card is cropped to; the
       content is kept clear of the edges because other surfaces crop it further. One
       theme only, dark: a social card is a fixed image and cannot answer a media query. -->
  <defs>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4493f8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4493f8" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#010409" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0d1117"/>
  <ellipse cx="640" cy="120" rx="620" ry="400" fill="url(#glow)"/>

  <g text-anchor="middle">
    <text x="640" y="165" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="-5" fill="url(#wm)">hyper</text>
    <text x="640" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="29" fill="#f0f6fc">Nothing reaches the world unreviewed;</text>
    <text x="640" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="29" fill="#f0f6fc">nothing changes unseen.</text>
    <text x="640" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#9198a1">AI-authored, human-reviewable infrastructure automation.</text>
  </g>

  <g filter="url(#sh)">
    <rect x="190" y="345" width="900" height="265" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  </g>
  <circle cx="214" cy="364" r="5.5" fill="#ff5f57"/>
  <circle cx="233" cy="364" r="5.5" fill="#febc2e"/>
  <circle cx="252" cy="364" r="5.5" fill="#28c840"/>
  <text x="640" y="369" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9198a1">hyper review retire-preview-envs</text>
  <line x1="190" y1="383" x2="1090" y2="383" stroke="#30363d" stroke-width="1.5"/>

  <line x1="470" y1="396" x2="470" y2="522" stroke="#3d444d" stroke-width="1.5"/>
  <line x1="214" y1="426" x2="1066" y2="426" stroke="#3d444d" stroke-width="1.5"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">
    <text x="458" y="412" text-anchor="end" fill="#9198a1">PROCEDURE</text>
    <text x="486" y="412" fill="#9198a1">a91f0c2 → working tree</text>
    <text x="458" y="454" text-anchor="end" fill="#ff7b72" font-weight="700">DESTROY</text>
    <text x="486" y="454" fill="#f0f6fc">- id: retire</text>
    <text x="458" y="480" text-anchor="end" fill="#9198a1">staging</text>
    <text x="486" y="480" fill="#f0f6fc">operation: delete_server</text>
  </g>

  <rect x="214" y="492" width="852" height="26" fill="#4493f8" fill-opacity="0.16"/>
  <rect x="214" y="492" width="3" height="26" fill="#4493f8"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">
    <text x="486" y="510" fill="#4493f8" font-weight="700">~</text>
    <text x="508" y="510" fill="#f0f6fc">bound: 5</text>
  </g>

  <text x="214" y="542" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.8" fill="#9198a1">FLAGS</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
    <text x="214" y="570" fill="#ff7b72" font-weight="700">DESTROY</text>
    <text x="330" y="570" fill="#9198a1">line 24</text>
    <text x="424" y="570" fill="#f0f6fc">delete_server, bound 5</text>
    <text x="214" y="594" fill="#d29922" font-weight="700">WIDENED</text>
    <text x="330" y="594" fill="#9198a1">line 34</text>
    <text x="424" y="594" fill="#f0f6fc">bound 3 → 5 since a91f0c2</text>
  </g>
</svg>
