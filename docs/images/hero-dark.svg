<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="hyper: author, check, review, a human decides, run — and the records read back">
  <!-- hero-light.svg and hero-dark.svg differ only in the five colour values; every coordinate
       below is identical in both, so an edit made to one and not the other shows up as a diff.
       No external font, no script, no raster — this file is read the way an artefact is. -->
  <rect width="1280" height="400" fill="#0d1117"/>

  <!-- Wordmark and claim -->
  <text x="88" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="104" font-weight="700" letter-spacing="-3" fill="#f0f6fc">hyper</text>
  <line x1="88" y1="195" x2="400" y2="195" stroke="#3d444d" stroke-width="2"/>
  <text x="88" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="23" fill="#f0f6fc">Nothing reaches the world unreviewed;</text>
  <text x="88" y="273" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="23" fill="#f0f6fc">nothing changes unseen.</text>
  <text x="88" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#9198a1">AI-authored, human-reviewable infrastructure automation.</text>

  <!-- The loop -->
  <g stroke="#3d444d" stroke-width="1.5" fill="none">
    <rect x="770" y="16" width="300" height="52" rx="8"/>
    <rect x="770" y="88" width="300" height="52" rx="8"/>
    <rect x="770" y="168" width="300" height="52" rx="8"/>
    <rect x="770" y="332" width="300" height="52" rx="8"/>
  </g>
  <rect x="770" y="260" width="300" height="52" rx="8" fill="#4493f8"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="19" text-anchor="middle">
    <text x="920" y="48" fill="#f0f6fc">author</text>
    <text x="920" y="120" fill="#f0f6fc">check</text>
    <text x="920" y="200" fill="#f0f6fc">review</text>
    <text x="920" y="292" fill="#0d1117" font-weight="700">a human decides</text>
    <text x="920" y="364" fill="#f0f6fc">run</text>
  </g>

  <!-- Nothing crosses this line unreviewed -->
  <line x1="770" y1="240" x2="1070" y2="240" stroke="#4493f8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <g stroke="#9198a1" stroke-width="1.5" fill="#9198a1">
    <line x1="920" y1="68" x2="920" y2="81"/>
    <polygon points="913,80 927,80 920,88" stroke="none"/>
    <line x1="920" y1="140" x2="920" y2="161"/>
    <polygon points="913,160 927,160 920,168" stroke="none"/>
    <line x1="920" y1="220" x2="920" y2="253"/>
    <polygon points="913,252 927,252 920,260" stroke="none"/>
    <line x1="920" y1="312" x2="920" y2="325"/>
    <polygon points="913,324 927,324 920,332" stroke="none"/>
    <path d="M1070,358 H1138 A12,12 0 0 0 1150,346 V54 A12,12 0 0 0 1138,42 H1078" fill="none"/>
    <polygon points="1078,35 1078,49 1070,42" stroke="none"/>
  </g>
  <text x="1168" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#9198a1">records</text>
</svg>
