kind: provider
provider: widget
schema-version: 1
class: widgetco
capabilities: [http]
operations:
  list_widgets:
    kind: read
    deadline: 30s
    http: {method: GET, host: "{from-target}", path: /widgets}
    # The list endpoint pages, and the record: block below reads the page.
    record:
      over: $.body.result
      identity: $.id
      fields: {id: $.id}

  delete_widget:
    kind: mutate
    deadline: 30s
    http: {method: POST, host: "{from-target}", path: "/widgets/{id}/archive"}
    record:
      identity: "{id}"
      fields: {id: $.body.id}
    # Archived rather than deleted: the API has no delete.

# Authored by hand: this Manifest carries no origin: block.
