kind: provider
provider: dns
schema-version: 1
class: cloudflare
capabilities: [http]
auth:
  header: {name: Authorization, prefix: "Bearer "}
operations:
  list_records:
    kind: read
    repeatability: repeatable
    deadline: 30s
    http:
      method: GET
      host: "{from-target}"
      path: /client/v4/zones/{zone_id}/dns_records
    input:
      type: object
      properties:
        zone_id: {type: string}
    record:
      over: $.body.result
      identity: $.id
      fields: {id: $.id, name: $.name}
origin:
  ref: https://providers.example.com/acme/dns.yaml
  digest: sha256:d2ed2c9148d3065e57b2fed8023ea46b46f291d98cc7eff13f8fc59cc434351f
