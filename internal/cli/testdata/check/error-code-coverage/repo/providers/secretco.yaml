kind: provider
provider: secretco
schema-version: 1
class: secretco
capabilities: [http]
auth:
  header: {name: Authorization, prefix: "Bearer "}
operations:
  create_widget:
    kind: mutate
    repeatability: skip-if-recorded
    deadline: 30s
    http:
      method: POST
      host: "{from-target}"
      path: /widgets
      body: {name: "{name}"}
    input:
      type: object
      properties:
        name: {type: string}
    record:
      identity: "{name}"
      fields:
        id: $.body.id
        name: $.body.name
        token: $.body.token
    secret: [token]
  destroy_widget:
    kind: destroy
    repeatability: repeatable
    deadline: 30s
    http:
      method: DELETE
      host: "{from-target}"
      path: /widgets/{widget_id}
    input:
      type: object
      properties:
        widget_id: {type: string}
