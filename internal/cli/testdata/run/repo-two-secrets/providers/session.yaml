kind: provider
provider: session
schema-version: 1
class: local
capabilities: [http]
operations:
  read_session:
    kind: read
    deadline: 1s
    http:
      method: GET
      host: "{from-target}"
      path: /session
      host-input: host
    input:
      type: object
      properties:
        host: {type: string}
    record:
      identity: $.host
      fields:
        host: $.host
        token: $.body.token
        expires_at: $.body.expires_at
    secret: [token]
