kind: provider
provider: vault
schema-version: 1
class: vault
capabilities: [http]
auth:
  basic: {}
operations:
  read_leaf:
    kind: read
    deadline: 10s
    http:
      method: GET
      host: "{from-target}"
      path: /v1/leaf
      host-input: host
    input:
      type: object
      properties:
        host: {type: string}
    record:
      identity: $.host
      fields:
        host: $.host
        sent: $.body.authorization
