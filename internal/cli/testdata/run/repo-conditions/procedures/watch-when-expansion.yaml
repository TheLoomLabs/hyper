kind: procedure
procedure: watch-when-expansion
targets: [local]
steps:
  - id: probe
    definition: uptime-check
    operation: check_http
    target: local
    args:
      host: status.hyper.dev

  - id: guarded
    definition: uptime-check
    operation: check_named
    target: local
    when:
      step: probe
      field: status
      equals: 200
    over:
      observations:
        - field: host
          exists: true
    args:
      host: {item: $.host}

  - id: after
    definition: uptime-check
    operation: check_http
    target: local
    args:
      host: db.hyper.dev
