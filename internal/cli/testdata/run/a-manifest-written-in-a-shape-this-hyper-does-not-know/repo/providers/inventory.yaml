kind: provider
provider: inventory
schema-version: 2
class: cloudflare
capabilities: []
retries: 3
operations:
  list_hosts:
    kind: read
    deadline: 30s
    http: {method: GET, host: "{from-target}", path: /v1/hosts}
    input: {type: object, properties: {}}
    record: {identity: $.id, fields: {id: $.id}}
