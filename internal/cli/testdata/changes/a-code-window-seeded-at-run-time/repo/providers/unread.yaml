kind: provider
provider: unread
schema-version: 1
class: local
capabilities: [http, shell]
operations:
  ping:
    kind: read
    deadline: 10s
    http:
      method: GET
      host: "{from-target}"
      path: /
    input:
      type: object
      properties: {}
    record:
      identity: $.host
      fields:
        host: $.host
