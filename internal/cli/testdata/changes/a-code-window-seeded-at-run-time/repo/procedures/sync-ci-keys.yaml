kind: procedure
procedure: sync-ci-keys
targets: [staging, production]
cadence: "*/5 * * * *"
steps:
  - id: issue-runner-keys
    definition: ci-keys
    operation: create_key
    target: staging
    bound: 3
    over:
      values: [ci-arm64, ci-x86, ci-macos, ci-arm64-2]
  - id: retire-expired
    definition: ci-keys
    operation: delete_key
    target: production
    over:
      assets:
        - field: expires
          older_than: 0s
        - field: created
          older_than: 30d
